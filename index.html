<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPTV</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f0f13; color: #fff; min-height: 100vh; overflow-x: hidden;
  }

  /* TOP BAR */
  .top-bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px; background: #111;
    border-bottom: 1px solid #222; position: sticky; top: 0; z-index: 50;
    gap: 10px; flex-wrap: wrap;
  }
  .top-bar .title { font-size: 16px; font-weight: 700; }
  .gps-info {
    display: none;
    align-items: center; gap: 12px;
    background: #1a1a22; border: 1px solid #2a2a35;
    padding: 6px 12px; border-radius: 10px;
    font-size: 13px; white-space: nowrap;
  }
  .gps-info.visible { display: flex; }
  .gps-item { display: flex; align-items: center; gap: 4px; }
  .gps-item .icon { font-size: 15px; }
  .gps-item .val { font-weight: 700; }
  .gps-item .lbl { color: #888; font-size: 11px; }
  .weather-info {
    display: none;
    align-items: center; gap: 6px;
    background: #1a1a22; border: 1px solid #2a2a35;
    padding: 6px 12px; border-radius: 10px;
    font-size: 13px; white-space: nowrap;
  }
  .weather-info.visible { display: flex; }
  .weather-info .w-icon { font-size: 18px; }
  .weather-info .w-temp { font-weight: 700; }
  .traffic-btn {
    background: #2a2a35; border: none; color: #fff;
    padding: 8px 14px; border-radius: 10px;
    font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .traffic-btn:hover { background: #3a3a48; }
  .view-btn {
    background: #4a7dff; border: none; color: #fff;
    padding: 10px 18px; border-radius: 10px;
    font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .view-btn:hover { background: #3a6bef; }
  .view-btn.active { background: #ff9800; }

  #status { text-align: center; padding: 8px; font-size: 12px; color: #aaa; }
  #status.error { color: #ff5555; }
  #status.success { color: #4ade80; }

  /* VISTA GRIGLIA */
  #channels {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 8px; padding: 10px;
  }
  @media (max-width: 600px) and (orientation: portrait) { #channels { grid-template-columns: repeat(3, 1fr); } }
  @media (orientation: landscape) and (min-width: 900px) { #channels { grid-template-columns: repeat(5, 1fr); gap: 10px; } }
  @media (min-width: 1400px) { #channels { grid-template-columns: repeat(6, 1fr); } }

  .channel {
    background: #1a1a22; border-radius: 12px; border: 1px solid #2a2a35;
    cursor: pointer; transition: transform 0.15s, background 0.2s;
    aspect-ratio: 1 / 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; overflow: hidden; padding: 6px;
  }
  .channel:hover { background: #22222e; transform: translateY(-2px); }
  .channel:active { transform: scale(0.96); }
  .channel img {
    width: 100%; height: 100%; max-height: 82%;
    object-fit: contain; background: #fff; border-radius: 8px; padding: 6px;
  }
  .channel .name {
    font-size: 10px; font-weight: 500; text-align: center; margin-top: 4px;
    overflow: hidden; text-overflow: ellipsis;
    display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical;
    line-height: 1.1; width: 100%; color: #ccc;
  }

  /* VISTA LISTA */
  #timeline { display: none; flex-direction: column; gap: 8px; padding: 10px; }
  body.list-view #channels { display: none; }
  body.list-view #timeline { display: flex; }

  .timeline-row {
    background: #1a1a22; border-radius: 12px; border: 1px solid #2a2a35;
    display: flex; align-items: center; padding: 12px 16px; gap: 16px;
    cursor: pointer; transition: background 0.15s; min-height: 100px;
  }
  .timeline-row:hover { background: #22222e; }
  .timeline-logo {
    width: 120px; height: 80px; object-fit: contain;
    background: #fff; border-radius: 8px; padding: 5px; flex-shrink: 0;
  }
  .timeline-info { flex: 1; min-width: 0; }
  .timeline-channel-name {
    font-size: 18px; font-weight: 700; color: #fff;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .timeline-group {
    font-size: 12px; color: #666; margin-top: 4px;
    text-transform: uppercase; letter-spacing: 0.5px;
  }

  /* BOTTONE AGGIORNA */
  .bottom-bar { display: flex; justify-content: center; padding: 20px 0 30px; }
  button.action {
    padding: 14px 32px; border-radius: 12px; border: none;
    background: #4a7dff; color: #fff; font-size: 15px;
    font-weight: 600; cursor: pointer;
  }
  button.action:hover { background: #3a6bef; }
  button.action:disabled { background: #333; cursor: not-allowed; }

  /* MODALE TRAFFICO */
  #trafficOverlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.9); z-index: 2000;
    flex-direction: column;
  }
  #trafficOverlay.visible { display: flex; }
  .traffic-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px; background: #111;
    border-bottom: 1px solid #222;
  }
  .traffic-header .traffic-title { font-size: 16px; font-weight: 700; }
  .traffic-header .close-traffic {
    background: #2a2a35; border: none; color: #fff;
    width: 40px; height: 40px; border-radius: 10px;
    font-size: 20px; cursor: pointer;
  }
  .traffic-body { flex: 1; }
  .traffic-body iframe { width: 100%; height: 100%; border: 0; }

  /* PLAYER */
  #playerOverlay {
    display: none; position: fixed; inset: 0;
    background: #000; z-index: 1000; flex-direction: column;
  }
  #playerOverlay.visible { display: flex; }

  .player-header {
    display: flex; align-items: center; gap: 16px;
    padding: 18px 22px; background: #111;
    border-bottom: 1px solid #222; min-height: 84px; flex-shrink: 0;
  }
  .player-header .info { flex: 1; min-width: 0; }
  .player-header .title {
    font-size: 22px; font-weight: 700;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .player-header .group { font-size: 14px; color: #888; margin-top: 3px; }
  .hdr-btn {
    background: #2a2a35; border: none; color: #fff;
    width: 58px; height: 58px; border-radius: 14px;
    font-size: 26px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .hdr-btn:hover { background: #3a3a48; }
  .close-btn { font-size: 30px; }

  .player-body { flex: 1; display: flex; min-height: 0; position: relative; }
  .video-wrap { flex: 1; display: flex; align-items: center; justify-content: center; background: #000; }
  video { width: 100%; height: 100%; background: #000; object-fit: contain; }

  /* MENU PLAYER */
  #channelMenu {
    width: 420px; background: #111; border-left: 1px solid #222;
    display: flex; flex-direction: column;
    transform: translateX(100%); transition: transform 0.25s ease;
    position: absolute; right: 0; top: 0; bottom: 0; z-index: 10;
  }
  #channelMenu.visible { transform: translateX(0); }
  .menu-header {
    padding: 14px 16px; border-bottom: 1px solid #222;
    display: flex; align-items: center; justify-content: space-between;
    flex-shrink: 0;
  }
  .menu-header .menu-title { font-size: 15px; font-weight: 700; }
  .close-menu {
    background: #2a2a35; border: none; color: #fff;
    width: 34px; height: 34px; border-radius: 8px;
    font-size: 18px; cursor: pointer;
  }
  .menu-list { flex: 1; overflow-y: auto; padding: 6px; -webkit-overflow-scrolling: touch; }
  .menu-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px; border-radius: 8px; cursor: pointer;
    transition: background 0.15s; border: 1px solid transparent;
  }
  .menu-item:hover { background: #1f1f2b; }
  .menu-item.active { background: #1a2340; border-color: #4a7dff; }
  .menu-item img {
    width: 60px; height: 46px; object-fit: contain;
    background: #fff; border-radius: 5px; padding: 3px; flex-shrink: 0;
  }
  .menu-info { flex: 1; min-width: 0; }
  .menu-name {
    font-size: 14px; font-weight: 600; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .menu-item.active .menu-name { color: #4a7dff; }

  .menu-list::-webkit-scrollbar { width: 6px; }
  .menu-list::-webkit-scrollbar-thumb { background: #2a2a35; border-radius: 3px; }

  @media (max-width: 700px) { #channelMenu { width: 300px; } }
</style>
</head>
<body>

<div class="top-bar">
  <div class="title">📺 IPTV</div>
  <div class="gps-info" id="gpsInfo">
    <div class="gps-item" id="gpsSpeed">
      <span class="icon">🚗</span>
      <span class="val" id="speedVal">--</span>
      <span class="lbl">km/h</span>
    </div>
    <div class="gps-item" id="gpsAlt">
      <span class="icon">⛰️</span>
      <span class="val" id="altVal">--</span>
      <span class="lbl">m</span>
    </div>
  </div>
  <div class="weather-info" id="weatherInfo">
    <span class="w-icon" id="wIcon">☀️</span>
    <span class="w-temp" id="wTemp">--°</span>
  </div>
  <button class="traffic-btn" id="trafficBtn">🚦 Traffico</button>
  <button class="view-btn" id="viewBtn">📋 Lista</button>
</div>

<div id="status"></div>

<div id="channels"></div>
<div id="timeline"></div>

<div class="bottom-bar">
  <button class="action" id="refreshBtn">🔄 Aggiorna</button>
</div>

<!-- MODALE TRAFFICO -->
<div id="trafficOverlay">
  <div class="traffic-header">
    <div class="traffic-title">🚦 Traffico in tempo reale</div>
    <button class="close-traffic" id="closeTrafficBtn">✕</button>
  </div>
  <div class="traffic-body" id="trafficBody"></div>
</div>

<!-- PLAYER -->
<div id="playerOverlay">
  <div class="player-header">
    <div class="info">
      <div class="title" id="playerTitle">Canale</div>
      <div class="group" id="playerGroup"></div>
    </div>
    <button class="hdr-btn" id="menuToggleBtn">☰</button>
    <button class="hdr-btn close-btn" id="closePlayerBtn">✕</button>
  </div>
  <div class="player-body">
    <div class="video-wrap">
      <video id="videoEl" controls playsinline autoplay></video>
    </div>
    <div id="channelMenu">
      <div class="menu-header">
        <div class="menu-title">📺 Canali</div>
        <button class="close-menu" id="closeMenuBtn">✕</button>
      </div>
      <div class="menu-list" id="menuList"></div>
    </div>
  </div>
</div>

<script>
// ============ CONFIG ============
const PLAYLIST_URL = 'https://raw.githubusercontent.com/riddik14/iptv/main/playlist_italy.m3u';
const STORAGE_KEY = 'iptv_playlist_v10';
const VIEW_KEY = 'iptv_view_mode';
const WEATHER_API = 'https://api.open-meteo.com/v1/forecast';

// ============ DOM ============
const $ = id => document.getElementById(id);
const statusEl = $('status'), channelsEl = $('channels'), timelineEl = $('timeline');
const refreshBtn = $('refreshBtn'), viewBtn = $('viewBtn');
const playerOverlay = $('playerOverlay'), videoEl = $('videoEl');
const playerTitle = $('playerTitle'), playerGroup = $('playerGroup');
const closePlayerBtn = $('closePlayerBtn'), menuToggleBtn = $('menuToggleBtn');
const channelMenu = $('channelMenu'), closeMenuBtn = $('closeMenuBtn'), menuList = $('menuList');
const gpsInfo = $('gpsInfo'), gpsSpeed = $('gpsSpeed'), gpsAlt = $('gpsAlt');
const speedVal = $('speedVal'), altVal = $('altVal');
const weatherInfo = $('weatherInfo'), wIcon = $('wIcon'), wTemp = $('wTemp');
const trafficBtn = $('trafficBtn'), trafficOverlay = $('trafficOverlay');
const trafficBody = $('trafficBody'), closeTrafficBtn = $('closeTrafficBtn');

// ============ STATO ============
let allChannels = [], hls = null, currentChannel = null;
let viewMode = localStorage.getItem(VIEW_KEY) || 'grid';
let lastPos = null, lastTime = null;
let gpsOk = false, coordsOk = false;
let currentLat = null, currentLon = null;

// ============ UTILITÀ ============
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const placeholder = () => 'data:image/svg+xml;utf8,' + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" width="80" height="60">' +
  '<rect width="80" height="60" fill="#ddd"/>' +
  '<text x="50%" y="60%" font-size="24" text-anchor="middle" fill="#999">📺</text></svg>');

function makeImg(src, alt, cls) {
  const img = document.createElement('img');
  if (cls) img.className = cls;
  img.loading = 'lazy'; img.alt = alt;
  img.src = src || placeholder();
  img.onerror = () => { img.onerror = null; img.src = placeholder(); };
  return img;
}

// ============ GPS ============
function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat/2)**2 +
            Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon/2)**2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

function startGps() {
  if (!navigator.geolocation) return;
  navigator.geolocation.watchPosition(
    (pos) => {
      const c = pos.coords;
      const now = pos.timestamp;

      // Coordinate: valide se lat/lon non null
      if (c.latitude != null && c.longitude != null) {
        coordsOk = true;
        currentLat = c.latitude;
        currentLon = c.longitude;
      }

      // Velocità: prova API nativa, altrimenti calcola da haversine
      let speedKmh = null;
      if (c.speed != null && !isNaN(c.speed)) {
        speedKmh = c.speed * 3.6;
      } else if (lastPos && lastTime) {
        const dt = (now - lastTime) / 1000;
        if (dt > 0.5 && dt < 10) {
          const dist = haversine(lastPos.lat, lastPos.lon, c.latitude, c.longitude);
          speedKmh = (dist / dt) * 3.6;
        }
      }

      // Altitudine: solo se il browser la fornisce (spesso null su WebView)
      const altitude = (c.altitude != null && !isNaN(c.altitude)) ? c.altitude : null;

      // Mostra dati solo se validi
      let hasAny = false;
      if (speedKmh != null && speedKmh >= 0 && speedKmh < 300) {
        speedVal.textContent = speedKmh.toFixed(0);
        gpsSpeed.style.display = 'flex';
        hasAny = true;
      } else {
        gpsSpeed.style.display = 'none';
      }

      if (altitude != null) {
        altVal.textContent = altitude.toFixed(0);
        gpsAlt.style.display = 'flex';
        hasAny = true;
      } else {
        gpsAlt.style.display = 'none';
      }

      if (hasAny) gpsInfo.classList.add('visible');

      // Se ho le coordinate, carica meteo (una volta sola o ogni 10 min)
      if (coordsOk && currentLat && currentLon) {
        loadWeather(currentLat, currentLon);
      }

      lastPos = { lat: c.latitude, lon: c.longitude };
      lastTime = now;
    },
    (err) => {
      console.warn('GPS error:', err.message);
      gpsInfo.classList.remove('visible');
      weatherInfo.classList.remove('visible');
    },
    { enableHighAccuracy: true, maximumAge: 5000, timeout: 15000 }
  );
}

let weatherLoaded = false;
let lastWeatherLat = null, lastWeatherLon = null;

async function loadWeather(lat, lon) {
  // Non ricaricare se già fatto per questa posizione (tolleranza 5km)
  if (weatherLoaded && lastWeatherLat && lastWeatherLon) {
    const dist = haversine(lastWeatherLat, lastWeatherLon, lat, lon);
    if (dist < 5000) return;
  }

  try {
    const url = `${WEATHER_API}?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&timezone=auto`;
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const temp = Math.round(data.current.temperature_2m);
    const code = data.current.weather_code;

    wIcon.textContent = weatherEmoji(code);
    wTemp.textContent = temp + '°C';
    weatherInfo.classList.add('visible');

    weatherLoaded = true;
    lastWeatherLat = lat;
    lastWeatherLon = lon;
  } catch (err) {
    console.warn('Weather failed:', err);
    weatherInfo.classList.remove('visible');
  }
}

function weatherEmoji(code) {
  if (code === 0) return '☀️';
  if (code <= 2) return '🌤️';
  if (code === 3) return '☁️';
  if (code === 45 || code === 48) return '🌫️';
  if (code >= 51 && code <= 57) return '🌦️';
  if (code >= 61 && code <= 67) return '🌧️';
  if (code >= 71 && code <= 77) return '🌨️';
  if (code >= 80 && code <= 82) return '🌧️';
  if (code >= 85 && code <= 86) return '❄️';
  if (code >= 95) return '⛈️';
  return '🌡️';
}

// ============ TRAFFICO (Waze) ============
trafficBtn.addEventListener('click', () => {
  if (!coordsOk || !currentLat || !currentLon) {
    alert('Posizione GPS non disponibile. Il traffico richiede le coordinate.');
    return;
  }
  const iframe = document.createElement('iframe');
  iframe.src = `https://embed.waze.com/iframe?zoom=13&lat=${currentLat}&lon=${currentLon}&pin=1`;
  iframe.loading = 'lazy';
  trafficBody.innerHTML = '';
  trafficBody.appendChild(iframe);
  trafficOverlay.classList.add('visible');
});

closeTrafficBtn.addEventListener('click', () => {
  trafficOverlay.classList.remove('visible');
  trafficBody.innerHTML = '';
});

// ============ PARSER M3U ============
function parseM3U(text) {
  text = text.replace(/^\uFEFF/, '');
  const channels = [];
  let current = null;
  for (const raw of text.split(/\r?\n/)) {
    const line = raw.trim();
    if (!line) continue;
    if (line.startsWith('#EXTINF:')) {
      const ch = { name: 'Sconosciuto', logo: '', group: '', tvgId: '' };
      const commaIdx = line.lastIndexOf(',');
      if (commaIdx !== -1) ch.name = line.substring(commaIdx + 1).trim();
      const get = attr => (line.match(new RegExp(attr + '="([^"]*)"', 'i')) || [])[1] || '';
      ch.logo = get('tvg-logo');
      ch.group = get('group-title');
      ch.tvgId = get('tvg-id');
      current = ch;
    } else if (line.startsWith('#')) {
      continue;
    } else if (current) {
      current.url = line;
      channels.push(current);
      current = null;
    }
  }
  return channels;
}

// ============ RENDER GRIGLIA ============
function renderGrid() {
  channelsEl.innerHTML = '';
  const frag = document.createDocumentFragment();
  for (const ch of allChannels) {
    const div = document.createElement('div');
    div.className = 'channel';
    div.appendChild(makeImg(ch.logo, ch.name));
    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = ch.name;
    div.appendChild(name);
    div.addEventListener('click', () => openPlayer(ch));
    frag.appendChild(div);
  }
  channelsEl.appendChild(frag);
}

// ============ RENDER LISTA ============
function renderTimeline() {
  if (viewMode !== 'list') return;
  timelineEl.innerHTML = '';
  const frag = document.createDocumentFragment();

  for (const ch of allChannels) {
    const row = document.createElement('div');
    row.className = 'timeline-row';

    row.appendChild(makeImg(ch.logo, ch.name, 'timeline-logo'));

    const info = document.createElement('div');
    info.className = 'timeline-info';

    const nameEl = document.createElement('div');
    nameEl.className = 'timeline-channel-name';
    nameEl.textContent = ch.name;
    info.appendChild(nameEl);

    if (ch.group) {
      const groupEl = document.createElement('div');
      groupEl.className = 'timeline-group';
      groupEl.textContent = ch.group;
      info.appendChild(groupEl);
    }

    row.appendChild(info);
    row.addEventListener('click', () => openPlayer(ch));
    frag.appendChild(row);
  }
  timelineEl.appendChild(frag);
}

// ============ RENDER MENU PLAYER ============
function renderMenu(activeChannel) {
  menuList.innerHTML = '';
  const frag = document.createDocumentFragment();

  for (const ch of allChannels) {
    const item = document.createElement('div');
    item.className = 'menu-item' + (ch.url === activeChannel.url ? ' active' : '');

    item.appendChild(makeImg(ch.logo, ch.name));

    const info = document.createElement('div');
    info.className = 'menu-info';

    const nameEl = document.createElement('div');
    nameEl.className = 'menu-name';
    nameEl.textContent = ch.name;
    info.appendChild(nameEl);

    item.appendChild(info);
    item.addEventListener('click', () => {
      startStream(ch.url);
      playerTitle.textContent = ch.name;
      playerGroup.textContent = ch.group || '';
      currentChannel = ch;
      menuList.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
      item.classList.add('active');
      item.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    });

    frag.appendChild(item);
  }
  menuList.appendChild(frag);

  const activeEl = menuList.querySelector('.menu-item.active');
  if (activeEl) setTimeout(() => activeEl.scrollIntoView({ block: 'center' }), 50);
}

// ============ CAMBIO VISTA ============
function setView(mode) {
  viewMode = mode;
  localStorage.setItem(VIEW_KEY, mode);
  document.body.classList.toggle('list-view', mode === 'list');
  viewBtn.classList.toggle('active', mode === 'list');
  viewBtn.textContent = mode === 'list' ? '⊞ Griglia' : '📋 Lista';
  if (mode === 'list' && allChannels.length > 0) renderTimeline();
}

viewBtn.addEventListener('click', () => {
  setView(viewMode === 'grid' ? 'list' : 'grid');
});

// ============ CARICAMENTO PLAYLIST ============
async function loadPlaylist(force = false) {
  refreshBtn.disabled = true;
  statusEl.className = '';
  statusEl.textContent = 'Caricamento...';

  if (!force) {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const data = JSON.parse(raw);
        if (data?.channels?.length) {
          allChannels = data.channels;
          const date = new Date(data.savedAt).toLocaleString('it-IT');
          statusEl.className = 'success';
          statusEl.textContent = `📂 ${allChannels.length} canali (${date})`;
          renderGrid();
          if (viewMode === 'list') renderTimeline();
          refreshBtn.disabled = false;
          return;
        }
      }
    } catch {}
  }

  try {
    const res = await fetch(PLAYLIST_URL, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    if (!text.includes('#EXTINF')) throw new Error('File non valido');

    allChannels = parseM3U(text);
    if (!allChannels.length) throw new Error('Nessun canale');

    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        savedAt: Date.now(), channels: allChannels
      }));
    } catch {}

    statusEl.className = 'success';
    statusEl.textContent = `✅ ${allChannels.length} canali`;
    renderGrid();
    if (viewMode === 'list') renderTimeline();
  } catch (err) {
    statusEl.className = 'error';
    statusEl.textContent = '⚠️ ' + err.message;
  } finally {
    refreshBtn.disabled = false;
  }
}

refreshBtn.addEventListener('click', () => {
  if (confirm('Ricaricare la lista dal server?')) {
    loadPlaylist(true);
  }
});

// ============ PLAYER ============
function openPlayer(channel) {
  currentChannel = channel;
  playerTitle.textContent = channel.name;
  playerGroup.textContent = channel.group || '';
  playerOverlay.classList.add('visible');
  renderMenu(channel);
  startStream(channel.url);
}

function startStream(url) {
  if (hls) { hls.destroy(); hls = null; }
  videoEl.removeAttribute('src');
  videoEl.load();

  if (typeof Hls !== 'undefined' && Hls.isSupported()) {
    hls = new Hls({ lowLatencyMode: true, backBufferLength: 30, maxBufferLength: 30, enableWorker: true });
    hls.loadSource(url);
    hls.attachMedia(videoEl);
    hls.on(Hls.Events.MANIFEST_PARSED, () => videoEl.play().catch(() => {}));
    hls.on(Hls.Events.ERROR, (e, data) => {
      if (!data.fatal) return;
      if (data.type === Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad();
      else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
      else destroyPlayer();
    });
  } else if (videoEl.canPlayType('application/vnd.apple.mpegurl')) {
    videoEl.src = url;
    videoEl.addEventListener('loadedmetadata', () => videoEl.play().catch(() => {}), { once: true });
  } else {
    alert('Formato non supportato');
    destroyPlayer();
  }
}

function destroyPlayer() {
  if (hls) { hls.destroy(); hls = null; }
  videoEl.pause();
  videoEl.removeAttribute('src');
  videoEl.load();
}

function closePlayer() {
  destroyPlayer();
  playerOverlay.classList.remove('visible');
  channelMenu.classList.remove('visible');
  currentChannel = null;
}

closePlayerBtn.addEventListener('click', closePlayer);
menuToggleBtn.addEventListener('click', () => channelMenu.classList.toggle('visible'));
closeMenuBtn.addEventListener('click', () => channelMenu.classList.remove('visible'));
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (trafficOverlay.classList.contains('visible')) {
    trafficOverlay.classList.remove('visible');
    trafficBody.innerHTML = '';
  } else if (channelMenu.classList.contains('visible')) {
    channelMenu.classList.remove('visible');
  } else if (playerOverlay.classList.contains('visible')) {
    closePlayer();
  }
});

// ============ START ============
setView(viewMode);
loadPlaylist();
startGps();
</script>
